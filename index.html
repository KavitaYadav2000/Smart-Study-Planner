<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Smart Study Planner</title>
    <meta name="description" content="StudyFlow builds a daily study schedule from your exam date and subjects, and automatically re-plans when you miss a day.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg" aria-hidden="true"><span></span><span></span></div>

    <header class="top container">
        <a href="#" class="logo"><span class="mark">S</span>StudyFlow</a>
        <div class="top-actions">
            <button class="btn ghost sm" id="sampleBtn">Load sample</button>
            <button class="btn ghost sm" id="resetBtn">Reset</button>
            <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
        </div>
    </header>

    <main class="container">
        <div id="notice" role="status"></div>

        <section class="stats" id="stats"></section>

        <div class="cols">
            <div class="col">
                <section class="card" id="today"></section>
                <section class="card" id="upcoming"></section>
            </div>

            <aside class="col">
                <section class="card">
                    <h2>Plan settings</h2>
                    <div class="grid2">
                        <label>Exam date
                            <input type="date" id="examDate">
                        </label>
                        <label>Study hours / day
                            <select id="hours"></select>
                        </label>
                    </div>
                    <p class="hint" id="settingsHint"></p>
                </section>

                <section class="card">
                    <h2>Subjects</h2>
                    <div id="subjectList"></div>
                    <form id="subjectForm" class="sub-form" autocomplete="off">
                        <div class="grid2">
                            <label>Subject name
                                <input type="text" id="subName" placeholder="e.g. Data Structures" maxlength="30" required>
                            </label>
                            <label>Difficulty
                                <select id="subDiff">
                                    <option value="1">Easy</option>
                                    <option value="2" selected>Medium</option>
                                    <option value="3">Hard</option>
                                </select>
                            </label>
                        </div>
                        <label>Topics (one per line, optional)
                            <textarea id="subTopics" rows="3" placeholder="Arrays&#10;Linked lists&#10;Trees"></textarea>
                        </label>
                        <button class="btn primary" type="submit">Add subject</button>
                    </form>
                </section>

                <section class="card" id="activity"></section>
            </aside>
        </div>
    </main>

    <footer class="container foot">
        Your data stays in this browser. Hard topics get more sessions, and missed sessions are re-spread automatically.
    </footer>

    <div class="toast" id="toast" role="status"></div>

    <script src="planner.js"></script>
    <script src="app.js"></script>
</body>

</html>
